{% extends "base.html" %}
{% block title %}Sign in · Black Rhino{% endblock %}
{% block public_content %}
<div class="login-screen">
  <div class="login-card">
    <img src="/static/logo.png" class="login-logo">
    <div class="eyebrow">LIQUOR STORE POS</div>
    <h1>Sign in to Black Rhino</h1>
    <p class="muted">Your local point-of-sale workspace.</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide">Sign in</button>
    </form>
    <div class="login-note">Offline-ready · Local database · Role-controlled access</div>
  </div>
</div>
{% endblock %}
